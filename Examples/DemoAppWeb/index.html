<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SimConsole web demo</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 880px; margin: 32px auto; padding: 0 24px;
  }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: #888; font-size: 13px; margin-bottom: 28px; }
  .grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 24px;
  }
  section { border: 1px solid color-mix(in srgb, currentColor 15%, transparent); border-radius: 8px; padding: 16px; }
  h2 { font-size: 12px; margin: 0 0 10px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
  button {
    display: block; width: 100%; padding: 8px 12px; margin: 4px 0;
    background: color-mix(in srgb, currentColor 4%, transparent);
    border: 1px solid color-mix(in srgb, currentColor 15%, transparent);
    border-radius: 6px; font: inherit; cursor: pointer; text-align: left;
    color: inherit;
  }
  button:hover { background: color-mix(in srgb, currentColor 8%, transparent); }
  button[data-running] { background: color-mix(in srgb, #4a9eff 22%, transparent); }
  #log {
    margin-top: 24px; padding: 12px 14px; background: #1c1c1e; color: #d4d4d4;
    border-radius: 6px; font-family: ui-monospace, Menlo, monospace;
    font-size: 12px; max-height: 220px; overflow-y: auto;
    white-space: pre-wrap;
  }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
</style>
</head>
<body>
  <h1>SimConsole — web demo</h1>
  <div class="sub">
    Open the panel beside this page (<code>--platform web</code>) and click
    any button. Every action surfaces in a structured tab.
  </div>

  <div class="grid">
    <section>
      <h2>Metrics</h2>
      <button onclick="SimConsole.metric.gauge('cache.hit_rate', Math.random())">gauge cache.hit_rate (random)</button>
      <button onclick="SimConsole.metric.counter('retries')">counter retries++</button>
      <button onclick="SimConsole.metric.signpost('feed_decode', 80 + Math.floor(Math.random()*60))">signpost feed_decode ~80–140ms</button>
      <button onclick="hangMainThread()">Block main thread 600ms (hang)</button>
    </section>

    <section>
      <h2>Network (auto-instrumented)</h2>
      <button onclick="fetch('https://jsonplaceholder.typicode.com/posts/1').then(r => r.json()).then(j => write('GET /posts/1 → ' + JSON.stringify(j).slice(0,80)))">GET /posts/1</button>
      <button onclick="postJson()">POST /posts (JSON body)</button>
      <button onclick="fetch('https://httpbin.org/status/404').then(r => write('GET /status/404 → ' + r.status))">GET /status/404 (error status)</button>
      <button onclick="fetch('https://httpbin.org/delay/3').then(r => write('GET /delay/3 → done'))">GET /delay/3 (slow)</button>
    </section>

    <section>
      <h2>Analytics</h2>
      <button onclick="SimConsole.analytics('button_tapped', {button:'one', n: ++ctr})">Fire analytics event</button>
      <button onclick="SimConsole.analytics('purchase', {sku:'premium_monthly', price:9.99, currency:'USD'})">purchase (typed-like)</button>
      <button onclick="SimConsole.screen('Settings', {source:'demo'})">screen: Settings</button>
      <button onclick="SimConsole.screen('Profile', {source:'demo', user_id:'demo-123'})">screen: Profile</button>
    </section>

    <section>
      <h2>Logs</h2>
      <button onclick="SimConsole.log('info line #' + (++ctr), 'info', {ctr})">log .info</button>
      <button onclick="SimConsole.log('warn line', 'warn', {ctr})">log .warn</button>
      <button onclick="SimConsole.log('Decode failed', 'error', {endpoint:'/api/v1/profile', received_keys:['id','username']})">log .error (rich)</button>
      <button onclick="SimConsole.log('Cart updated', 'info', {items:[{sku:'A1',qty:2},{sku:'B7',qty:1}], total:44.48})">log nested object</button>
    </section>
  </div>

  <section style="margin-top: 24px;">
    <h2>Auto activity</h2>
    <div class="row">
      <button id="auto" onclick="toggleAuto(this)">Start auto-fire (mixed)</button>
      <button onclick="bridgeHealth()">Probe bridge /health</button>
    </div>
  </section>

  <div id="log"></div>

  <!-- Drop the SDK in as a plain ESM module. In a real project this would
       be `import SimConsole from '@simconsole/web'` after npm install. -->
  <script type="module">
    import SimConsole from '../../web/sdk/src/index.js';
    window.SimConsole = SimConsole;
    SimConsole.bootstrap({
      subsystem: 'com.simconsole.demo.web',
      bridge: 'http://localhost:9229',
    });
    SimConsole.appFinishLaunching();
    SimConsole.screen('RootView');
    SimConsole.log('demo page loaded', 'info', { url: location.href });
  </script>

  <script>
    let ctr = 0;
    let autoTask = null;

    function write(msg) {
      const el = document.getElementById('log');
      const ts = new Date().toISOString().slice(11, 19);
      el.textContent = `[${ts}] ${msg}\n` + el.textContent;
    }

    function postJson() {
      fetch('https://jsonplaceholder.typicode.com/posts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: 'SimConsole', body: 'hello from the demo', userId: 1 }),
      }).then(r => r.json()).then(j => write('POST /posts → id=' + j.id));
    }

    function hangMainThread() {
      const t0 = performance.now();
      while (performance.now() - t0 < 600) { /* burn */ }
      write('hung main thread for 600ms');
    }

    async function bridgeHealth() {
      try {
        const r = await fetch('http://localhost:9229/health');
        write('bridge /health → ' + (await r.text()).slice(0, 120));
      } catch (e) {
        write('bridge unreachable: ' + e.message);
      }
    }

    const ENDPOINTS = [
      ['GET', 'https://jsonplaceholder.typicode.com/posts/1'],
      ['GET', 'https://jsonplaceholder.typicode.com/users/2'],
      ['GET', 'https://httpbin.org/status/200'],
      ['GET', 'https://httpbin.org/status/404'],
    ];
    const EVENT_NAMES = ['page_view', 'button_tapped', 'scroll', 'swipe', 'long_press'];

    function toggleAuto(btn) {
      if (autoTask) {
        clearInterval(autoTask);
        autoTask = null;
        btn.textContent = 'Start auto-fire (mixed)';
        delete btn.dataset.running;
        return;
      }
      btn.dataset.running = '1';
      btn.textContent = 'Stop auto-fire';
      let n = 0;
      autoTask = setInterval(() => {
        n++;
        SimConsole.analytics(EVENT_NAMES[n % EVENT_NAMES.length], { tick: n, weight: Math.random() });
        SimConsole.log('auto tick', 'info', { tick: n, rss_mb: 80 + (n % 60) });
        if (n % 3 === 0) SimConsole.metric.gauge('queue.depth', n);
        const ep = ENDPOINTS[n % ENDPOINTS.length];
        fetch(ep[1], { method: ep[0] }).catch(() => {});
      }, 1500);
    }
  </script>
</body>
</html>
